[package]
name = "syntaxmate-python"
description = "Python bindings for the Syntaxmate TextMate highlighter"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lib]
name = "_native"
crate-type = ["cdylib"]
# The extension links against the interpreter only when built by maturin.
test = false
doctest = false

[features]
default = ["bundled-grammars"]
# Embeds the full grammar catalog; without it, use `Highlighter.from_bundle`.
bundled-grammars = ["syntaxmate-boundary/bundled-grammars"]

[dependencies]
pyo3 = { version = "0.29", features = ["abi3-py39"] }
# Not `workspace = true`: the workspace entry enables default features.
syntaxmate-boundary = { path = "../boundary", default-features = false }
