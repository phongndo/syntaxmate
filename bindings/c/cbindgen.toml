# Generates include/syntaxmate.h; run `make -C bindings/c header` after API changes.
language = "C"
cpp_compat = true
include_guard = "SYNTAXMATE_H"
style = "type"
usize_is_size_t = true
documentation_style = "c99"
header = """/*
 * Syntaxmate C API. SPDX-License-Identifier: MIT
 *
 * Status-returning functions return SM_OK (0) or an sm_status error code and
 * report detail through sm_last_error_message(). Text inputs are UTF-8
 * (pointer, length) pairs and need not be NUL-terminated. Everything the
 * library returns is freed with the matching sm_*_free function.
 */"""
# Only what the declarations use; cbindgen's defaults add stdarg.h and stdlib.h.
no_includes = true
sys_includes = ["stdbool.h", "stddef.h", "stdint.h"]
autogen_warning = "/* Generated by cbindgen from src/lib.rs. Do not edit. */"

[export]
include = ["sm_offset_unit"]

[enum]
prefix_with_name = false
