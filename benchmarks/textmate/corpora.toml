version = 1

# This corpus follows the project documentation so it stays representative.
# Its generated manifest records exact metrics, but this index deliberately
# does not lock them: ordinary documentation edits must not require a follow-up
# benchmark metadata commit.
[[corpus]]
id = "representative-markdown"
path = "target/textmate-performance/corpora/representative-markdown.md"
builder = "tools/build-textmate-corpora.py"
language = "markdown"
scope = "text.html.markdown"
content_contract = "dynamic"

