name: Bindings (Python)

on:
  workflow_dispatch:
  pull_request:
    paths: &paths
      - "bindings/python/**"
      - "bindings/boundary/**"
      - "bindings/conformance/**"
      - "bindings/Cargo.*"
      - "src/**"
      - "assets/**"
      - "Cargo.toml"
      - "rust-toolchain.toml"
      - ".github/workflows/bindings-python.yml"
  push:
    branches: [main]
    paths: *paths

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: read

concurrency:
  group: syntaxmate-bindings-python-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash
    working-directory: bindings/python

jobs:
  # One abi3 wheel per OS, tested on the oldest and newest supported Pythons.
  wheel:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: bindings
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        id: oldest
        with:
          python-version: "3.11"
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        id: newest
        with:
          python-version: "3.14"
      - name: Build wheel
        run: |
          python -m pip install --quiet "maturin>=1.9.4,<2"
          maturin build --release --strip --out dist
          ls -l dist
      - name: Test wheel on the oldest and newest Python
        env:
          OLDEST: ${{ steps.oldest.outputs.python-path }}
          NEWEST: ${{ steps.newest.outputs.python-path }}
        run: |
          for py in "$OLDEST" "$NEWEST"; do
            rm -rf venv && "$py" -m venv venv
            bin=venv/bin; [ -d "$bin" ] || bin=venv/Scripts
            "$bin/python" -m pip install --quiet pytest dist/*.whl
            "$bin/python" -m pytest -q
          done
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: wheel-${{ matrix.os }}
          path: bindings/python/dist/*.whl
          if-no-files-found: error

  # Stubs must match the extension, and the sdist must rebuild into a wheel.
  stubs-and-sdist:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: bindings
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - run: python -m venv .venv
      - run: .venv/bin/pip install --quiet "maturin>=1.9.4,<2" mypy pytest
      - run: .venv/bin/maturin develop --release
      - run: .venv/bin/python -m mypy.stubtest syntaxmate
      - run: .venv/bin/python -m mypy --strict python/syntaxmate
      - name: Build a wheel from the sdist
        run: |
          .venv/bin/maturin sdist --out sdist
          mkdir sdist-src && tar -xzf sdist/*.tar.gz -C sdist-src --strip-components=1
          cd sdist-src && ../.venv/bin/maturin build --release --out ../sdist-wheel
          ls -l ../sdist-wheel
      # Outside the repository no rust-toolchain.toml applies, as for users.
      - name: pip install the sdist in a fresh venv
        run: |
          python -m venv "$RUNNER_TEMP/sdist-venv"
          "$RUNNER_TEMP/sdist-venv/bin/pip" install --quiet "$PWD"/sdist/*.tar.gz
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/sdist-venv/bin/python" -c "import syntaxmate; print(syntaxmate.Highlighter().html('fn main() {}', 'rust')[:40])"
