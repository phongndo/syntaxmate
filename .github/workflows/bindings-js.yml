name: Bindings (JavaScript)

on:
  workflow_dispatch:
  # The release workflow reuses these jobs and publishes the packed tarball.
  workflow_call:
    inputs:
      ref:
        description: Git ref to build
        type: string
        required: true
  pull_request:
    paths: &paths
      - "bindings/wasm/**"
      - "bindings/boundary/**"
      - "bindings/conformance/**"
      - "bindings/Cargo.*"
      - "src/**"
      - "assets/**"
      - "Cargo.toml"
      - "rust-toolchain.toml"
      - ".github/workflows/bindings-js.yml"
  push:
    branches: [main]
    paths: *paths

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: read

concurrency:
  group: syntaxmate-bindings-js-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: bindings/wasm

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
      # rust-toolchain.toml pins the compiler and overrides any toolchain an
      # action selects, so add the wasm target to that pinned toolchain.
      - run: rustup toolchain install && rustup target add wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: bindings
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - uses: taiki-e/install-action@9983c65e42da123ff25d1f78505eb6de315aa172 # v2.87.20
        with:
          # Must match the wasm-bindgen crate version in bindings/Cargo.lock.
          tool: wasm-bindgen@0.2.121
      # Ubuntu's binaryen cannot parse current rustc output; pin the release
      # the wasm Nix shell uses.
      - name: Install binaryen
        env:
          VERSION: "129"
          SHA256: 50b9fa62b9abea752da92ec57e0c555fee578760cd237c40107957715d2976ba
        working-directory: ${{ runner.temp }}
        run: |
          archive="binaryen-version_${VERSION}-x86_64-linux.tar.gz"
          curl -fsSLO "https://github.com/WebAssembly/binaryen/releases/download/version_${VERSION}/${archive}"
          echo "${SHA256}  ${archive}" | sha256sum -c -
          tar -xzf "${archive}"
          echo "${PWD}/binaryen-version_${VERSION}/bin" >> "$GITHUB_PATH"
      - run: cargo clippy -p syntaxmate-wasm --target wasm32-unknown-unknown --locked -- -D warnings
      - run: npm run build
      - run: npm run typecheck
      - name: Report package size
        run: |
          raw=$(stat -c %s dist/syntaxmate_bg.wasm)
          gz=$(gzip -9c dist/syntaxmate_bg.wasm | wc -c)
          {
            echo "### syntaxmate npm package"
            echo "- wasm: ${raw} bytes (${gz} gzipped)"
            echo '```'
            npm pack --dry-run 2>&1 | tail -n 6
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - run: npm pack
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: npm-package
          path: |
            bindings/wasm/*.tgz
            bindings/wasm/dist/
            bindings/wasm/grammars.bundle
            bindings/wasm/third-party/
            bindings/wasm/LICENSE
          if-no-files-found: error

  # The wasm is platform-independent; test the built package on every
  # supported Node line and OS.
  test:
    needs: build
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [24, 26]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: npm-package
          path: bindings/wasm
      - run: npm test

  # Consume the packed tarball the way an npm user does, including a bundled
  # program deployed without node_modules (see "Bundling for Node").
  consumer:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: consumer
    steps:
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: npm-package
          path: ${{ runner.temp }}/package
      - name: Create a consumer project
        working-directory: .
        run: |
          mkdir consumer
          cd consumer
          echo '{ "name": "consumer", "private": true, "type": "module" }' > package.json
          npm install --no-audit --no-fund "$RUNNER_TEMP"/package/*.tgz esbuild@0.25
      - name: Use the installed package
        run: |
          cat > smoke.mjs <<'EOF'
          import assert from 'node:assert/strict'
          import { createHighlighter, SyntaxmateError } from 'syntaxmate'
          const h = await createHighlighter()
          const source = 'let s = "😀 日本";'
          assert.match(h.html(source, { lang: 'rust', theme: 'github-dark' }), /<pre/)
          const tokens = h.tokens(source, { lang: 'rust', theme: 'github-dark' })
          for (const token of tokens) assert.ok(token.length > 0 && source.slice(token.start, token.start + token.length).length === token.length)
          assert.throws(() => h.html('x', { lang: 'nope', theme: 'github-dark' }), SyntaxmateError)
          console.log('installed package OK')
          EOF
          node smoke.mjs
      - name: Run a bundled program away from node_modules
        run: |
          cat > app.mjs <<'EOF'
          import { createHighlighter } from 'syntaxmate'
          const assets = new URL('./assets/', import.meta.url)
          const h = await createHighlighter({
            wasm: new URL('syntaxmate.wasm', assets),
            bundle: new URL('grammars.bundle', assets),
          })
          console.log('bundled program OK', h.html('fn main() {}', { lang: 'rust', theme: 'github-dark' }).length)
          EOF
          npx esbuild app.mjs --bundle --platform=node --format=esm --outfile=deploy/app.mjs
          mkdir deploy/assets
          cp node_modules/syntaxmate/dist/syntaxmate_bg.wasm deploy/assets/syntaxmate.wasm
          cp node_modules/syntaxmate/grammars.bundle deploy/assets/
          mv deploy "$RUNNER_TEMP/deploy"
          node "$RUNNER_TEMP/deploy/app.mjs"
