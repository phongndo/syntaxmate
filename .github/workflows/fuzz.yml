name: Scheduled fuzzing

on:
  schedule:
    - cron: "43 3 * * 2,5"
  workflow_dispatch:
  pull_request:
    paths:
      - "fuzz/**"
      - ".github/workflows/fuzz.yml"

permissions:
  contents: read

concurrency:
  group: syntaxmate-fuzz
  cancel-in-progress: true

jobs:
  fuzz:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        target: [grammar_and_source, theme_json]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c
        with:
          toolchain: nightly
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2.9.1
        with:
          workspaces: fuzz -> target
      - name: Install cargo-fuzz
        uses: taiki-e/install-action@6a1bd70eaac3c8bdf093356838d7ee09fda951cf # v2
        with:
          tool: cargo-fuzz
      # cargo-binstall ships a musl cargo-fuzz binary that would otherwise default
      # fuzz builds to x86_64-unknown-linux-musl, which is incompatible with ASAN.
      # PRs smoke-test the GNU target and corpus; schedules keep the long campaign.
      - name: Fuzz ${{ matrix.target }}
        env:
          FUZZ_SECONDS: ${{ github.event_name == 'pull_request' && '45' || '300' }}
        run: >-
          cargo +nightly fuzz run --target x86_64-unknown-linux-gnu
          ${{ matrix.target }} --
          -max_total_time=${FUZZ_SECONDS} -timeout=15 -rss_limit_mb=4096
