name: Scheduled fuzzing

on:
  schedule:
    - cron: "43 3 * * 2,5"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: syntaxmate-fuzz
  cancel-in-progress: true

jobs:
  fuzz:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        target: [grammar_and_source, theme_json]
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - uses: dtolnay/rust-toolchain@fa04a1451ff1842e2626ccb99004d0195b455a88
        with:
          toolchain: nightly
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2.9.1
        with:
          workspaces: fuzz -> target
      - name: Install cargo-fuzz
        uses: taiki-e/install-action@6a1bd70eaac3c8bdf093356838d7ee09fda951cf # v2
        with:
          tool: cargo-fuzz
      - name: Fuzz ${{ matrix.target }}
        run: >-
          cargo fuzz run ${{ matrix.target }} --
          -max_total_time=300 -timeout=15 -rss_limit_mb=4096
