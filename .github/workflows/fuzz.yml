name: Scheduled fuzzing

on:
  schedule:
    - cron: "43 3 * * 2,5"
  workflow_dispatch:
  pull_request:
    paths:
      - "fuzz/**"
      - ".github/workflows/fuzz.yml"

permissions:
  contents: read

concurrency:
  group: syntaxmate-fuzz
  cancel-in-progress: true

jobs:
  fuzz:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        target: [grammar_and_source, theme_json]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master
        with:
          toolchain: nightly
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: fuzz -> target
      - name: Install cargo-fuzz
        uses: taiki-e/install-action@9983c65e42da123ff25d1f78505eb6de315aa172 # v2.87.20
        with:
          tool: cargo-fuzz
      # cargo-binstall ships a musl cargo-fuzz binary that would otherwise default
      # fuzz builds to x86_64-unknown-linux-musl, which is incompatible with ASAN.
      # PRs smoke-test the GNU target and corpus; schedules keep the long campaign.
      - name: Fuzz ${{ matrix.target }}
        env:
          FUZZ_SECONDS: ${{ github.event_name == 'pull_request' && '45' || '300' }}
        run: >-
          cargo +nightly fuzz run --target x86_64-unknown-linux-gnu
          ${{ matrix.target }} --
          -max_total_time=${FUZZ_SECONDS} -timeout=15 -rss_limit_mb=4096
