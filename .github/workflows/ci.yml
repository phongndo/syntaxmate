name: CI

on:
  workflow_call:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: "1"

permissions:
  contents: read

concurrency:
  group: syntaxmate-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c
        with:
          toolchain: stable
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2.9.1
      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets --all-features --locked -- -D warnings
      - run: cargo check --lib --no-default-features --locked
      - run: cargo check --manifest-path fuzz/Cargo.toml --locked
      - run: RUSTDOCFLAGS="-D warnings" cargo doc --no-deps --all-features --locked
      - name: Install cargo-deny
        uses: taiki-e/install-action@6a1bd70eaac3c8bdf093356838d7ee09fda951cf # v2
        with:
          tool: cargo-deny
      - name: Dependency policy
        run: cargo deny check
      - name: Unit and public API tests
        run: >-
          cargo test --all-features --locked --
          --skip textmate_golden::manifest_golden_cases_match_or_are_allowlisted
          --skip textmate_golden::manifest_golden_cases_have_no_budget_degradation
          --skip textmate_golden::manifest_golden_cases_replay_incremental_state_deterministically
      - run: cargo run --bin syntaxmate-bundle --features bundle-tools --locked -- --check
      - run: cargo run --release --example bundle-measure --locked -- --assert-max-bundle-bytes 9000000

  msrv:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c
        with:
          toolchain: "1.88"
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2.9.1
      - run: cargo check --all-targets --all-features --locked
      - run: cargo check --lib --no-default-features --locked

  feature-powerset:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2.9.1
      - name: Install cargo-hack
        uses: taiki-e/install-action@6a1bd70eaac3c8bdf093356838d7ee09fda951cf # v2
        with:
          tool: cargo-hack
      - run: >-
          cargo hack check --locked --lib --feature-powerset --depth 2
          --exclude-features bundle-tools
      - name: Custom themes without bundled themes
        run: >-
          cargo test --locked --no-default-features --features bundled-grammars
          --test custom_theme_session

  semver:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2.9.1
      - name: Detect published baseline
        id: baseline
        shell: bash
        run: |
          status="$(curl --silent --show-error \
            --user-agent "syntaxmate-ci/0.1 (+https://github.com/${GITHUB_REPOSITORY})" \
            --write-out '%{http_code}' \
            --output /tmp/syntaxmate-crate.json \
            https://crates.io/api/v1/crates/syntaxmate)"
          case "$status" in
            200)
              python3 -c 'import json; assert json.load(open("/tmp/syntaxmate-crate.json"))["crate"]["id"] == "syntaxmate"'
              echo "exists=true" >> "$GITHUB_OUTPUT"
              ;;
            404)
              echo "No crates.io baseline yet; skipping the bootstrap release."
              echo "exists=false" >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "crates.io baseline lookup failed with HTTP $status" >&2
              exit 1
              ;;
          esac
      - name: Install cargo-semver-checks
        if: steps.baseline.outputs.exists == 'true'
        uses: taiki-e/install-action@6a1bd70eaac3c8bdf093356838d7ee09fda951cf # v2
        with:
          tool: cargo-semver-checks
      - name: Check public API compatibility
        if: steps.baseline.outputs.exists == 'true'
        run: cargo +stable semver-checks check-release --manifest-path Cargo.toml

  golden:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    env:
      SYNTAXMATE_STRICT: "1"
      SYNTAXMATE_SHARD_INDEX: ${{ matrix.shard }}
      SYNTAXMATE_SHARD_TOTAL: "4"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2.9.1
      - run: cargo test --all-features --locked textmate_golden::manifest_golden_cases_

  generated:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: tools/golden-oracle/package-lock.json
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c
        with:
          toolchain: 1.88.0
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2.9.1
      - run: npm ci --prefix tools/golden-oracle
      - run: node tools/regex-conformance.mjs --out target/regex-conformance.json
      - run: node tools/test-regex-execution-parity.mjs
      - run: >-
          node tools/regex-execution-parity.mjs
          --max-executions 512 --out target/regex-execution-parity.json
      - run: >-
          node tools/grammar-stats.mjs assets/grammars/languages
          --conformance-diff --fail-on-gaps --compact
          > target/grammar-regex-coverage.json
      - run: >-
          node tools/fuzz-regex-conformance.mjs
          --seed 1 --cases 256 --out target/regex-differential-fuzz.json
      - run: node tools/generate-textmate-cases.mjs --check
      - run: node tools/generate-goldens.mjs --check
      - run: node tools/generate-theme-goldens.mjs --check
      - run: node tools/theme-selector-conformance.mjs
      - run: node tools/theme-catalog-parity.mjs --check
      - run: python3 tools/check-textmate-theme-assets.py
      - run: node tools/vendor-textmate-themes.mjs --check
      - run: python3 tools/build-textmate-corpora.py --check
      - run: python3 tools/generate-language-status.py --check
      - run: python3 tools/check-language-docs.py --check

  performance:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2.9.1
      - run: python3 tools/build-textmate-corpora.py --check
      - run: cargo build --release --example profile-cold --locked
      - run: python3 tools/check-textmate-catalog-performance.py --ci

  package:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2.9.1
      - run: cargo package --locked
      - name: Check packaged default API
        run: |
          mkdir -p target/package-consumer/src
          cat > target/package-consumer/Cargo.toml <<'TOML'
          [package]
          name = "syntaxmate-package-consumer"
          version = "0.0.0"
          edition = "2024"
          [dependencies]
          syntaxmate = { path = "../package/syntaxmate-0.1.0" }
          TOML
          cat > target/package-consumer/src/main.rs <<'RS'
          use syntaxmate::Highlighter;
          fn main() -> syntaxmate::Result<()> {
              let mut highlighter = Highlighter::bundled()?;
              let output = highlighter.highlight("rust", "fn main() {}", "github-dark")?;
              assert!(output.status().is_complete());
              let html = highlighter.highlight_html("rust", "let x = \"<safe>\";", "github-dark")?;
              assert!(html.as_str().contains("&lt;safe&gt;"));
              Ok(())
          }
          RS
          cargo run --manifest-path target/package-consumer/Cargo.toml --quiet
      - name: Check packaged custom-assets API
        run: |
          mkdir -p target/package-custom-consumer/src
          cat > target/package-custom-consumer/Cargo.toml <<'TOML'
          [package]
          name = "syntaxmate-package-custom-consumer"
          version = "0.0.0"
          edition = "2024"
          [dependencies]
          syntaxmate = { path = "../package/syntaxmate-0.1.0", default-features = false, features = ["html"] }
          TOML
          cat > target/package-custom-consumer/src/main.rs <<'RS'
          use syntaxmate::{
              GrammarRegistry, HtmlOptions, Theme, Tokenizer, TokenizerOptions,
              render_html, style_document,
          };
          fn main() -> syntaxmate::Result<()> {
              let mut registry = GrammarRegistry::new();
              let root = registry.add_json(r#"{"scopeName":"source.demo","patterns":[]}"#)?;
              let mut tokenizer = Tokenizer::new(&registry, root, TokenizerOptions::default())?;
              let tokens = tokenizer.tokenize("<text>");
              assert!(tokens.status().is_complete());
              let theme = Theme::from_json(r#"{"name":"demo","tokenColors":[]}"#)?;
              let document = style_document(tokens, &theme);
              let html = render_html("<text>", &document, &HtmlOptions::default())?;
              assert!(html.as_str().contains("&lt;text&gt;"));
              Ok(())
          }
          RS
          cargo run --manifest-path target/package-custom-consumer/Cargo.toml --quiet

  platforms:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2.9.1
      - run: cargo test --all-features --locked public_api_tests

  coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c
        with:
          toolchain: stable
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2.9.1
      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@6a1bd70eaac3c8bdf093356838d7ee09fda951cf # v2
        with:
          tool: cargo-llvm-cov
      - name: Generate focused library coverage
        run: >-
          cargo llvm-cov --all-features --lib --locked --lcov
          --output-path lcov.info --
          --skip textmate_golden::manifest_golden_cases_match_or_are_allowlisted
          --skip textmate_golden::manifest_golden_cases_have_no_budget_degradation
          --skip textmate_golden::manifest_golden_cases_replay_incremental_state_deterministically

  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v4

  ci-success:
    name: CI success
    if: always()
    runs-on: ubuntu-latest
    needs:
      - quality
      - msrv
      - feature-powerset
      - semver
      - golden
      - generated
      - performance
      - package
      - platforms
      - coverage
      - dependency-review
    steps:
      - name: Require every CI job to pass
        env:
          JOB_RESULTS: ${{ toJSON(needs) }}
        run: |
          failures="$(jq -r '
            to_entries[]
            | select(.value.result != "success" and .value.result != "skipped")
            | "\(.key): \(.value.result)"
          ' <<<"$JOB_RESULTS")"
          if [[ -n "$failures" ]]; then
            printf 'Required CI jobs did not pass:\n%s\n' "$failures" >&2
            exit 1
          fi
