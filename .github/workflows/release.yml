name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: syntaxmate-release
  cancel-in-progress: false

jobs:
  ci:
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/ci.yml

  publish:
    needs: ci
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: crates-io
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - uses: dtolnay/rust-toolchain@fa04a1451ff1842e2626ccb99004d0195b455a88
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2.9.1

      - name: Verify release metadata
        id: release
        shell: bash
        run: |
          set -euo pipefail
          version="$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[0].version')"
          tag_version="${GITHUB_REF_NAME#v}"
          test "$version" = "$tag_version"
          grep -Fq "## ${version} - " CHANGELOG.md
          if grep -Fq "## ${version} - Unreleased" CHANGELOG.md; then
            echo "CHANGELOG.md still marks ${version} as Unreleased" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "archive=target/package/syntaxmate-${version}.crate" >> "$GITHUB_OUTPUT"

      - name: Package and checksum
        shell: bash
        run: |
          set -euo pipefail
          cargo package --locked
          archive="${{ steps.release.outputs.archive }}"
          sha256sum "$archive" > "${archive}.sha256"

      - name: Authenticate to crates.io with OIDC
        id: auth
        uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1

      - name: Publish crate
        run: cargo publish --locked
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}

      - name: Attest crate archive
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3
        with:
          subject-path: ${{ steps.release.outputs.archive }}

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.release.outputs.version }}
          ARCHIVE: ${{ steps.release.outputs.archive }}
        shell: bash
        run: |
          set -euo pipefail
          awk -v version="$VERSION" '
            index($0, "## " version " - ") == 1 { capture=1; next }
            capture && /^## / { exit }
            capture { print }
          ' CHANGELOG.md > release-notes.md
          gh release create "$GITHUB_REF_NAME" \
            --verify-tag \
            --title "$GITHUB_REF_NAME" \
            --notes-file release-notes.md \
            "$ARCHIVE" "${ARCHIVE}.sha256"
